<!DOCTYPE html>
<html>
<head>
<title>Leave Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-200">

<div class="card shadow p-4" style="width:500px;">
<div class="text-center mb-3">
<h1 class="text-center mb-3">Leave Application Page</h1>
</div>
<form method="POST" action="/submit_leave">

<div class="mb-3">
<label class="form-label">Full Name:</label>
<input type="text" name="name" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Staff ID:</label>
<input type="text" name="ID" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Phone Number:</label>
<input type="text" name="number" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Email:</label>
<input type="text" name="mail" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Password:</label>
<input type="password" name="password" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Department:</label>
<select name="department" class="form-select">
<option>IT</option>
<option>ADMINISTRATIVE</option>
<option>FINANCE</option>
<option>STORE</option>
<option>SECURITY</option>
<option>MAINTENANCE</option>
<option>ELECTRICAL</option>
<option>FARM</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Supervisor Name:</label>
<input type="text" name="supervisor_name" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Level:</label>
<select name="level" class="form-select">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Leave type:</label>
<select name="leave_type" class="form-select">
<option>ANNUAL</option>
<option>SICK</option>
<option>CASUAL</option>
<option>SABBATICAL</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Due for Leave?:</label>
<select name="due" class="form-select">
<option>Yes</option>
<option>No</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Start Date:</label><br>
<input type="date" name="date">
</div>  
<div class="mb-3">
<label class="form-label">Reason:</label>
<textarea rows="4" cols="20" name="reason" class="form-control"></textarea>
</div>
<button type="submit" class="btn btn-primary w-100">Submit Application</button>
</form>
</div>
</div>
</body>
</html>
