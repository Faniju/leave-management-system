<!DOCTYPE html>
<html>
<head>
<title>Edit Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-300">

<div class="card shadow p-4" style="width:550px;">

<h2 class="text-center mb-3">Edit Leave Request</h2>

<form method="POST" action="/update/{{ row[0] }}">

    <div class="mb-3">
<label class="form-label">Name:</label><br>
<input type="text" name="name" value="{{ row[1] }}" class="form-control"><br><br>
</div>

    <div class="mb-3">
<label class="form-label">Department:</label><br>
<select name="department" value="{{ row[2] }}" class="form-select">
<option>IT</option>
<option>ADMINISTRATIVE</option>
<option>FINANCE</option>
<option>STORE</option>
<option>SECURITY</option>
<option>MAINTENANCE</option>
<option>ELECTRICAL</option>
<option>FARM</option>
</select><br><br>
</div>

    <div class="mb-3">
<label class="form-label">Date:</label><br>
<input type="date" name="date" value="{{ row[3] }}" class="form-control"><br><br>
</div>

    <div class="mb-3">
<label class="form-label">Email:</label><br>
<input type="text" name="mail" value="{{ row[5] }}" class="form-control"><br><br>
</div>

    <div class="mb-3">
<label class="form-label">Leave Type:</label><br>
<select name="leave_type" value="{{ row[7] }}" class="form-select">
<option>CASUAL</option>
<option>ANNUAL</option>
<option>SABBATICAL</option>
<option>SICK</option>
</select><br><br>
</div>

<div class="mb-3">
<label  class="form-label">Number:</label><br>
<input type="text" name="number" value="{{ row[8] }}" class="form-control"><br><br>
</div>

    <div class="mb-3">
<label class="form-label">Supervisor's Name:</label><br>
<input type="text" name="supervisor_name" value="{{ row[6] }}" class="form-control"><br><br>
</div>
<div class="mb-3">
<label class="form-label">Staff ID:</label><br>
<input type="text" name="staff_id" value="{{ row[9] }}" class="form-control"><br><br>
</div>

<div class="mb-3">
<label class="form-label">Reason:</label><br>
<textarea name="reason" class="form-control">{{ row[4] }}</textarea><br><br>
</div>

<button type="submit" class="btn btn-primary">Update</button>

</form>

</body>
</html>
