<!DOCTYPE html>
<html>
<head>
<title>Users Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-300">

<div class="card shadow p-4" style="width:550px;">

<h1 class="text-center mb-3">All Users</h1>
<div class="mb-3">
<form method="GET" action="/profile">
<div class="mb-3">
<input type="text" name="search" placeholder="Search by Name" value="{{ request.args.get('search','') }}" class="form-control">
</div>
<div class="mb-3">
<select name="role" class="form-select">
<option value="">All Status</option>
<option value="Staff" {% if request.args.get('role')=='Staff' %}selected{% endif %}>Staff</option>
<option value="admin" {% if request.args.get('role')=='admin' %}selected{% endif %}>Admin</option>
</select>
</div>  
<button type="submit" class="btn btn-primary">Search</button>
<a href="/profile" class="btn btn-secondary">Reset</a>
</form>
</div>
<table class="table table-striped table-hover table-bordered">
<tr class="table-dark text-center">
<th style="height: 40px;">ID</th>
<th style="height: 40px;">Name</th>
<th style="height: 40px;">Password</th>
<th style="height: 40px;">Role</th>
<th style="height: 40px;">Action</th>
</tr>

{% for row in rows %}
<tr class="table-light text-justify">
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>
<a href="/edituser/{{ row[0] }}" class="btn btn-sm btn-primary">Edit</a>
<a href="/deleteu/{{ row[0] }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this request?')">Delete</a>
</td>
</tr>
{% endfor %}

</table>

<a href="/" class="btn btn-secondary">Logout</a>
<footer>
<p style="text-align:right;">
Powered by Faniju@fun
</p>
</footer>
</div>
</div>
</body>

</html>
