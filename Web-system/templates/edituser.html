<!DOCTYPE html>
<html>
<head>
<title>Edit Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4" style="width:350px;">

<h2 class="text-center mb-3">Edit User</h2>

<form method="POST" action="/updateuser/{{ row[0] }}">

<div class="mb-3">
<label class="form-label">Name:</label>
<input type="text" name="name" value="{{ row[1] }}" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Password:</label>
<input type="text" name="password" value="{{ row[2] }}" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Role:</label>
<select name="role" value="{{ row[3] }}" class="form-select">
<option>Staff</option>
<option>Admin</option>
</select>
</div>

<button type="submit" class="btn btn-primary">Update</button>

</form>
</div>
</div>
</body>
</html>
