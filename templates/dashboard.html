<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.circle-card {
    border-radius: 50%;
    width: 200px;
    height: 200px;
    display: flex;
    flex-direction: row;
    gap: 10px;
    align-items: center;
    justify-content: center;
}
.hover:hover {
    transform: scale(1.1);
    transition: all 0.3s ease;
}
</style>

</head>
<body>

<div class="container mt-4" style="font-family:cursive ;">
<h2 class="text-center mb-3"> Employee Portal Dashboard</h2>
<div class="row text-center mt-5">

<div class="col-md-3">
<div class="circle-card shadow hover">
<div class="card-body" onclick="window.location.href='/requests'">
<h5>Total Requests</h5>
<h3>{{ total }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="circle-card shadow hover">
<div class="card-body text-success" onclick="window.location.href='/requests?status=Approved'">
<h5>Approved</h5>
<h3>{{ approved }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="circle-card shadow hover">
<div class="card-body text-warning" onclick="window.location.href='/requests?status=Pending'">
<h5>Pending</h5>
<h3>{{ pending }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="circle-card shadow hover">
<div class="card-body text-danger" onclick="window.location.href='/requests?status=Rejected'">
<h5>Rejected</h5>
<h3>{{ rejected }}</h3>
</div>
</div>
</div>

</div>

<div class="text-center mt-4" style="padding: 50px;">
<a href="/leave_portal" class="btn btn-primary hover" style="margin: 25px;">Apply Leave</a>
<a href="/requests" class="btn btn-success hover" style="margin: 25px;">View Requests</a>
<a href="/profile" class="btn btn-info hover" style="margin: 25px;">User Profile</a>
<a href="/" class="btn btn-danger hover" style="margin: 25px;">Logout</a>
</div>

</div>
</body>
<footer>
<div class="footer">
<marquee style="font-size: 12px; font-style: italic;">ASL Employee Portal Dashboard Power by Faniju </marquee>
</div>
</footer>
</html>
